lockfileVersion: '6.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

overrides:
  lockfile-override-dep: 0.9.0

dependencies:
  file-dep:
    specifier: 'file:./file-dep'
    version: 'file:file-dep'
  tag-dep:
    specifier: latest
    version: 1.0.0
  star-dep:
    specifier: '*'
    version: 1.0.0
  x-dep:
    specifier: x
    version: 1.0.0
  tar-dep:
    specifier: 'https://example.com/tar-dep/archive/1.9.0.tar.gz'
    version: '@example.com/tar-dep/archive/1.9.0.tar.gz'
  alias-dep:
    specifier: 'npm:alias-target@^5.0.0'
    version: /alias-target@4.17.21
  cat-dep:
    specifier: 'catalog:'
    version: 1.0.0
  ws-dep:
    specifier: 'workspace:^5.0.0'
    version: 1.0.0
  bad-dep:
    specifier: not a range
    version: 1.0.0
  lockfile-override-dep:
    specifier: 0.9.0
    version: 0.9.0
  link-dep:
    specifier: 'link:../link-dep'
    version: 'link:../link-dep'
  git-dep:
    specifier: 'github:example/git-dep#v5.0.0'
    version: '@github.com/example/git-dep/0123456789abcdef0123456789abcdef01234567'


packages:

  file:file-dep:
    resolution: {integrity: sha512-AAAA}
    name: file-dep
    version: 1.0.0
    dev: false

  /tag-dep@1.0.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /star-dep@1.0.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /x-dep@1.0.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /tar-dep@1.9.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /alias-target@4.17.21:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /cat-dep@1.0.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /ws-dep@1.0.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /bad-dep@1.0.0:
    resolution: {integrity: sha512-AAAA}
    dev: false

  /lockfile-override-dep@0.9.0:
    resolution: {integrity: sha512-AAAA}
    dev: false
